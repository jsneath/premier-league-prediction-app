<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#05060A" />

    <title>PL Predictions</title>
    <meta
      name="description"
      content="Predict Premier League scores, bank the points and settle it with your mates over 38 gameweeks."
    />

    <!-- Crest icons (replaces the default Create React App artwork) -->
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!--
      Link previews (WhatsApp, iMessage, Slack, Facebook, X). These scrapers do
      not run JavaScript and will not resolve relative paths, so og:image and
      og:url must be absolute.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PL Predictions" />
    <meta property="og:title" content="PL Predictions" />
    <meta
      property="og:description"
      content="Call the scores. Beat your mates. Premier League score predictions, 38 gameweeks, one winner."
    />
    <meta property="og:url" content="https://premier-league-prediction-app.vercel.app/" />
    <meta
      property="og:image"
      content="https://premier-league-prediction-app.vercel.app/og-image.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PL Predictions crest" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PL Predictions" />
    <meta
      name="twitter:description"
      content="Call the scores. Beat your mates. Premier League score predictions, 38 gameweeks, one winner."
    />
    <meta
      name="twitter:image"
      content="https://premier-league-prediction-app.vercel.app/og-image.png"
    />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
